<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"></head>
<body style="margin: 0; padding: 0; background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
    <table border="0" cellpadding="0" cellspacing="0" width="100%" style="background-color: #ffffff; padding: 30px 15px;">
        <tr><td align="center">
            <table border="0" cellpadding="0" cellspacing="0" width="600" style="background-color: #ffffff; text-align: left;">
                <tr><td style="padding-bottom: 20px;">
                    <table border="0" cellpadding="0" cellspacing="0" width="100%">
                        <tr>
                            <td align="left"><span style="font-size: 18px; font-weight: 900; color: #0A1128; text-transform: uppercase;">[ Aika ]</span></td>
                            <td align="right" style="font-size: 12px; font-weight: 800; text-transform: uppercase; color: #0A1128;">Platform Update</td>
                        </tr>
                    </table>
                </td></tr>
                <tr><td style="height: 6px; background: linear-gradient(90deg, #0A1128 0%, #84cc16 50%, #D4F53C 100%); border-radius: 4px;"></td></tr>
                <tr><td style="padding-top: 35px; padding-bottom: 12px; color: #4338ca; font-size: 13px; font-weight: 800; text-transform: uppercase;">What's new &middot; {{ date }}</td></tr>
                <tr><td style="padding-bottom: 24px;"><h1 style="color: #0A1128; font-size: 32px; font-weight: 900; margin: 0; line-height: 1.2;">{{ subject }}</h1></td></tr>
                <tr><td style="color: #1f2937; font-size: 16px; line-height: 1.7; padding-bottom: 40px; white-space: pre-line;">{{ content }}</td></tr>
                <tr><td style="border-top: 1px solid #e5e7eb; padding-top: 30px; text-align: center;">
                    <p style="margin: 0 0 8px 0; color: #6b7280; font-size: 12px;">You received this because you subscribed to updates from Aika. <a href="#" style="color: #4338ca; font-weight: 700;">Unsubscribe</a></p>
                </td></tr>
            </table>
        </td></tr>
    </table>
</body>
</html>
